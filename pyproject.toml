[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "restricted-sql-mcp-server"
version = "0.1.0"
description = "Secure restricted-SQL MCP and REST query server"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "mcp>=1.0,<2",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "sqlglot>=26,<27",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "httpx>=0.27,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
restricted-sql-server = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
